<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Campus Cab Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        body {
            background: linear-gradient(to right, #f8fff4, #e8f5e9);
            font-family: 'Poppins', sans-serif;
            color: #2e7d32;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 40px;
            text-shadow: 1px 1px 2px #a5d6a7;
        }

        .btn-custom {
            background-color: #43a047;
            color: white;
            font-size: 1.4rem;
            font-weight: 600;
            border-radius: 12px;
            padding: 20px 50px;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 10px rgba(67, 160, 71, 0.3);
        }

        .btn-custom:hover {
            background-color: #66bb6a;
            transform: translateY(-2px);
            box-shadow: 0px 6px 12px rgba(102, 187, 106, 0.4);
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        footer {
            margin-top: 60px;
            font-size: 1rem;
            color: #388e3c;
            opacity: 0.8;
        }

        .search-container {
            margin-bottom: 50px;
        }

        .search-container input {
            width: 300px;
            border-radius: 10px;
            border: 2px solid #43a047;
            padding: 10px;
            outline: none;
        }

        .btn-search {
            background-color: #2e7d32;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 500;
            margin-left: 10px;
            border: none;
        }

        .btn-search:hover {
            background-color: #43a047;
        }
    </style>
</head>
<body>

<div class="text-center">
    <h1>Perform All Crud Operations</h1>

    <!-- Management Buttons -->
    <div class="btn-row">
        <a href="/users" class="btn btn-custom"> Manage Users </a>
        <a href="/posts" class="btn btn-custom"> Manage Posts </a>
        <a href="/locations" class="btn btn-custom"> Manage Locations </a>
    </div>

    <footer class="mt-5">
        <p>Practical No : 12 - Spring Boot & Thymeleaf</p>
    </footer>
</div>

</body>
</html>
