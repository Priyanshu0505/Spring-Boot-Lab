<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Post Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <h2>Post Management</h2>
    <form th:action="@{/posts/add}" method="post" class="mb-4">
        <div class="row">
            <div class="col-md-4"><input type="text" name="title" placeholder="Title" class="form-control" required></div>
            <div class="col-md-4"><input type="text" name="content" placeholder="Content" class="form-control" required></div>
            <div class="col-md-4"><button class="btn btn-custom w-100">Add Post</button></div>
        </div>
    </form>
    <table class="table table-dark table-striped">
        <thead><tr><th>ID</th><th>Title</th><th>Content</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}"></td>
            <td th:text="${post.title}"></td>
            <td th:text="${post.content}"></td>
            <td><a th:href="@{'/posts/delete/' + ${post.id}}" class="btn btn-danger btn-sm">Delete</a></td>
        </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-custom mt-3">Back to Home</a>
</div>
</body>
</html>
