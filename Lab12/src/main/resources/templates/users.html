<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<form th:action="@{/users/search/firstname}" method="get" class="d-flex justify-content-center mb-4">
    <input type="text" name="firstName" placeholder="Enter first name" class="form-control w-25 me-2">
    <button type="submit" class="btn btn-custom">Search</button>
</form>
<div class="container">
    <h2>User Management</h2>
    <form th:action="@{/users/add}" method="post" class="mb-4">
        <div class="row">
            <div class="col-md-3"><input type="text" name="firstName" placeholder="First Name" class="form-control" required></div>
            <div class="col-md-3"><input type="text" name="lastName" placeholder="Last Name" class="form-control" required></div>
            <div class="col-md-3"><input type="email" name="email" placeholder="Email" class="form-control" required></div>
            <div class="col-md-3"><button class="btn btn-custom w-100">Add User</button></div>
        </div>
    </form>
    <table class="table table-dark table-striped">
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.firstName + ' ' + user.lastName}"></td>
            <td th:text="${user.email}"></td>
            <td>
                <a th:href="@{'/users/delete/' + ${user.id}}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-custom mt-3">Back to Home</a>
</div>
</body>
</html>
